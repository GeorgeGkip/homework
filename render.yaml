databases:
  - name: homeworkdb
    plan: free
    databaseName: homework
    user: homework

services:
  - type: web
    plan: free
    name: homework
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn homework.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homeworkdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
